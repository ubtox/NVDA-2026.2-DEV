default-groups = "all"
python-preference = "only-system"
environments = ["sys_platform == 'win32'"]
required-version = ">=0.9"

# py2exe 0.14.2.0 upstream still advertises Python <3.15 and does not publish
# CPython 3.15 wheels yet. The Python 3.15 probe workflow builds the unmodified
# source after opening that metadata gate and executes the resulting frozen EXE
# on both x64 and x86. Force source builds here so uv does not reject CP315 only
# because the registry has no pre-built cp315 wheel.
no-binary-package = ["py2exe"]

# Project sources belong in [tool.uv.sources] in pyproject.toml. Keeping them
# here makes current uv reject uv.toml before dependency resolution starts.

[[dependency-metadata]]
name = "py2exe"
version = "0.14.2.0"
requires-python = ">=3.10,<3.16"
requires-dist = ["cachetools", "packaging", "pefile"]
