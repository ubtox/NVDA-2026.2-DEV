name: Temporary Python 3.14.7 migration

on:
  push:
    branches:
      - 'try-evolution/2027.1-major-python-3.14.7'

permissions:
  contents: write

concurrency:
  group: python314-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[py314-lockregen]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize local package submodules
        shell: pwsh
        run: git submodule update --init --depth 1 miscDeps include/nvda-mathcat

      - name: Install Python 3.14.7
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
          update-environment: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Migrate project pins and local package model to Python 3.14.7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Content -Path '.python-versions' -Value 'cpython-3.14.7-windows-x86_64-none'
          Set-Content -Path 'runtime-builders/synthDriverHost32/.python-version' -Value 'cpython-3.14.7-windows-x86-none'

          foreach ($path in @('pyproject.toml', 'runtime-builders/synthDriverHost32/pyproject.toml')) {
            $text = Get-Content -Raw $path
            $text = $text.Replace('requires-python = ">=3.13,<3.14"', 'requires-python = ">=3.14,<3.15"')
            Set-Content -NoNewline -Path $path -Value $text
          }

          # uv workspaces require one intersecting requires-python range for every member.
          # Keep the same local packages, but model them as path dependencies so their
          # conservative upper bounds do not prevent NVDA from validating Python 3.14.
          $rootProject = 'pyproject.toml'
          $rootText = Get-Content -Raw $rootProject
          $rootText = $rootText.Replace('nvda-misc-deps = { workspace = true }', 'nvda-misc-deps = { path = "miscDeps" }')
          $rootText = $rootText.Replace('nvda-mathcat = { workspace = true }', 'nvda-mathcat = { path = "include/nvda-mathcat" }')
          $rootText = [regex]::Replace(
            $rootText,
            '(?ms)^\[tool\.uv\.workspace\]\r?\nmembers = \[\r?\n\t"miscDeps",\r?\n\t"include/nvda-mathcat",\r?\n\]\r?\n',
            ''
          )
          Set-Content -NoNewline -Path $rootProject -Value $rootText

          $devDoc = 'projectDocs/dev/createDevEnvironment.md'
          if (Test-Path $devDoc) {
            $text = Get-Content -Raw $devDoc
            $text = $text.Replace('3.13.15', '3.14.7')
            Set-Content -NoNewline -Path $devDoc -Value $text
          }

          Write-Host 'Remaining explicit 3.13.15 references in migrated build/config paths:'
          & git grep -n '3\.13\.15' -- '.python-versions' 'pyproject.toml' 'runtime-builders/synthDriverHost32' 'projectDocs/dev/createDevEnvironment.md' 2>$null
          $grepExit = $LASTEXITCODE
          if ($grepExit -gt 1) { exit $grepExit }
          $global:LASTEXITCODE = 0
          Write-Host 'Python pin scan complete.'

      - name: Resolve root lock for Python 3.14.7 / Windows markers
        shell: pwsh
        run: uv lock --python 3.14.7 --no-python-downloads

      - name: Resolve synthDriverHost32 lock for Python 3.14.7 / Windows markers
        shell: pwsh
        run: uv lock --project runtime-builders/synthDriverHost32 --python 3.14.7 --no-python-downloads

      - name: Verify locks
        shell: pwsh
        run: |
          uv lock --check --project . --python 3.14.7 --no-python-downloads
          uv lock --check --project runtime-builders/synthDriverHost32 --python 3.14.7 --no-python-downloads

      - name: Commit migration data
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          git status --short
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add -- '.python-versions' 'projectDocs/dev/createDevEnvironment.md' 'pyproject.toml' 'runtime-builders/synthDriverHost32/.python-version' 'runtime-builders/synthDriverHost32/pyproject.toml' 'runtime-builders/synthDriverHost32/uv.lock' 'uv.lock'
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Migration data already committed; nothing to push.'
            exit 0
          }
          $global:LASTEXITCODE = 0
          git commit -m 'build: migrate NVDA to Python 3.14.7 [py314-lockregen]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:"$env:REF_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
