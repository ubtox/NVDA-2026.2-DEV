name: Build BRLAPI for Python 3.15

on:
  workflow_dispatch:
  push:
    branches:
      - 'try-evolution/2027.1-python315-platform'
    paths:
      - '.github/workflows/brlapi315Build.yml'

permissions:
  contents: read

concurrency:
  group: brlapi315-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.15.0-rc.2'
  BRLTTY_REF: '06e44da90784505fc5d2869f75f02160d6855d03'

jobs:
  build:
    name: BRLAPI CPython 3.15 x64
    runs-on: windows-2025
    timeout-minutes: 30

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout pinned NV Access BRLTTY
        uses: actions/checkout@v7
        with:
          repository: nvaccess/brltty
          ref: ${{ env.BRLTTY_REF }}

      - name: Install Python 3.15 x64
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Install Python build dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools cython

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            autoconf
            automake
            make
            awk
            bison
            git
            groff
            m4
            patch
          pacboy: >-
            tcl:p
            pdcurses:p
            icu:p
            libiconv:p
            toolchain:p
            libusb:p

      - name: Apply Windows patch
        run: patch -p0 <"Windows/affinity.patch"

      - name: Apply Python 3.15 and current mingw-w64 compatibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          system_path = Path("Programs/system_windows.c")
          system_text = system_path.read_text(encoding="utf-8")
          anchor = '#include "messages.h"\n'
          compatibility = r'''

          /* Compatibility aliases for current mingw-w64 locale constants. */
          #ifndef SUBLANG_HAUSA_NIGERIA
          #define SUBLANG_HAUSA_NIGERIA SUBLANG_HAUSA_NIGERIA_LATIN
          #endif
          #ifndef SUBLANG_LAO_LAO_PDR
          #define SUBLANG_LAO_LAO_PDR SUBLANG_LAO_LAO
          #endif
          #ifndef SUBLANG_SYRIAC
          #define SUBLANG_SYRIAC SUBLANG_SYRIAC_SYRIA
          #endif
          #ifndef SUBLANG_TIBETAN_BHUTAN
          #define SUBLANG_TIBETAN_BHUTAN 0X02
          #endif
          '''
          if anchor not in system_text:
              raise SystemExit("Expected BRLTTY include anchor not found")
          system_text = system_text.replace(anchor, anchor + compatibility, 1)
          system_path.write_text(system_text, encoding="utf-8", newline="\n")

          makefile_path = Path("Bindings/Python/Makefile.in")
          makefile_text = makefile_path.read_text(encoding="utf-8")
          old = '\t"$(CYTHON)" -$(PYTHON_VERSION) -I. -X embedsignature=True -o $@ $(SRC_DIR)/brlapi.pyx'
          new = '\t"$(CYTHON)" -3 -I. -X embedsignature=True -o $@ $(SRC_DIR)/brlapi.pyx'
          if makefile_text.count(old) != 1:
              raise SystemExit("Expected BRLTTY Cython invocation not found exactly once")
          makefile_path.write_text(makefile_text.replace(old, new), encoding="utf-8", newline="\n")
          PY

      - name: Configure BRLTTY for Python 3.15
        run: |
          export PATH="$(cygpath -u "$pythonLocation")/scripts:$(cygpath -u "$pythonLocation"):$PATH"
          python --version
          ./autogen
          ./cfg-windows --prefix=/ --enable-relocatable-install --with-usb-package=winusb

      - name: Build only BRLAPI native API and Python binding
        run: |
          export PATH="$(cygpath -u "$pythonLocation")/scripts:$(cygpath -u "$pythonLocation"):$PATH"
          make -C Programs api brlapi_constants.h
          make -C Bindings/Python all

      - name: Stage BRLAPI Python 3.15 artifacts
        run: |
          mkdir -p cp315/{bin,python}
          egg="$(find Bindings/Python/dist -maxdepth 1 -name 'Brlapi-*-py3.15-win-amd64.egg' -print -quit)"
          test -n "$egg"
          python -m zipfile -e "$egg" cp315/python
          cp Programs/brlapi-*.dll cp315/bin/
          # BRLAPI links dynamically against MSYS2 libiconv. Package it next to BRLAPI so
          # consumers do not depend on a CI runner's PATH or an external MSYS2 installation.
          cp /ucrt64/bin/libiconv-2.dll cp315/bin/
          echo 'BRLAPI native DLL dependencies:'
          objdump -p Programs/brlapi-0.8.dll | grep 'DLL Name:' || true
          echo 'BRLAPI CP315 extension dependencies:'
          objdump -p "$(find cp315/python -name 'brlapi.cp315-win_amd64.pyd' -print -quit)" | grep 'DLL Name:' || true
          find cp315/python -maxdepth 3 -type f -print
          ls -la cp315/bin
          test -n "$(find cp315/python -name 'brlapi.cp315-win_amd64.pyd' -print -quit)"
          test -f cp315/bin/libiconv-2.dll

      - name: Verify BRLAPI CP315 import
        shell: pwsh
        run: |
          $pythonDir = (Resolve-Path 'cp315\python').Path
          $binDir = (Resolve-Path 'cp315\bin').Path
          $env:PATH = "$binDir;$env:PATH"
          python -c "import pathlib, sys; assert sys.version_info[:2] == (3, 15), sys.version; sys.path.insert(0, str(pathlib.Path(r'cp315/python').resolve())); import brlapi; assert 'cp315' in brlapi.__file__.lower(), brlapi.__file__; print('BRLAPI Python 3.15 import OK:', brlapi.__file__)"

      - name: Upload BRLAPI CP315 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: brlapi-cp315-win-amd64
          path: cp315
          if-no-files-found: error
