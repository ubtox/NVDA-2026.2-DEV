name: Python 3.15 compatibility gates

on:
  workflow_dispatch:
  push:
    branches:
      - 'try-evolution/2027.1-python315-platform'
  pull_request:
    branches:
      - 'try-evolution/2027.1-python315-platform'

permissions:
  contents: read

concurrency:
  group: python315-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interpreters:
    name: CPython 3.15 x64 and x86
    runs-on: windows-2025-vs2026
    steps:
      - name: Install Python 3.15 x64
        id: python64
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.0-rc.2"
          architecture: x64
      - name: Install Python 3.15 x86
        id: python32
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.0-rc.2"
          architecture: x86
          update-environment: false
      - name: Verify both interpreters
        shell: pwsh
        run: |
          python -c "import platform, sys; assert sys.version_info[:2] == (3, 15), sys.version; assert platform.architecture()[0] == '64bit'; print(sys.version, platform.architecture())"
          & '${{ steps.python32.outputs.python-path }}' -c "import platform, sys; assert sys.version_info[:2] == (3, 15), sys.version; assert platform.architecture()[0] == '32bit'; print(sys.version, platform.architecture())"

  pipBootstrap:
    name: ensurepip and pip on CPython 3.15 x64 and x86
    runs-on: windows-2025-vs2026
    steps:
      - name: Install Python 3.15 x64
        id: python64
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.0-rc.2"
          architecture: x64
      - name: Install Python 3.15 x86
        id: python32
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.0-rc.2"
          architecture: x86
          update-environment: false
      - name: Bootstrap pip with ensurepip on both interpreters
        shell: pwsh
        run: |
          $venv64 = Join-Path $env:RUNNER_TEMP 'ensurepip-cp315-x64'
          $venv32 = Join-Path $env:RUNNER_TEMP 'ensurepip-cp315-x86'
          python -m venv --without-pip $venv64
          & '${{ steps.python32.outputs.python-path }}' -m venv --without-pip $venv32
          & (Join-Path $venv64 'Scripts\python.exe') -m ensurepip --upgrade
          & (Join-Path $venv32 'Scripts\python.exe') -m ensurepip --upgrade
          & (Join-Path $venv64 'Scripts\python.exe') -m pip --version
          & (Join-Path $venv64 'Scripts\python.exe') -m pip check
          & (Join-Path $venv32 'Scripts\python.exe') -m pip --version
          & (Join-Path $venv32 'Scripts\python.exe') -m pip check
      - name: Verify runner pip on both interpreters
        shell: pwsh
        run: |
          python -m pip --version
          python -m pip check
          python -c "import pip, platform, sys; assert sys.version_info[:2] == (3, 15), sys.version; assert platform.architecture()[0] == '64bit'; print('pip CP315 x64 OK:', pip.__version__)"
          & '${{ steps.python32.outputs.python-path }}' -m pip --version
          & '${{ steps.python32.outputs.python-path }}' -m pip check
          & '${{ steps.python32.outputs.python-path }}' -c "import pip, platform, sys; assert sys.version_info[:2] == (3, 15), sys.version; assert platform.architecture()[0] == '32bit'; print('pip CP315 x86 OK:', pip.__version__)"

  mathcat:
    name: MathCAT abi3 import on CPython 3.15
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout NVDA
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Checkout only MathCAT
        shell: pwsh
        run: git submodule update --init --depth 1 include/nvda-mathcat
      - name: Install Python 3.15 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.0-rc.2"
          architecture: x64
      - name: Import MathCAT native extension
        shell: pwsh
        run: |
          python -c "import pathlib, sys; assert sys.version_info[:2] == (3, 15), sys.version; sys.path.insert(0, str(pathlib.Path('include/nvda-mathcat/assets').resolve())); import libmathcat_py; print('MathCAT Python 3.15 import OK:', libmathcat_py.__file__)"

  brlapi315:
    name: Build source-derived BRLAPI CP315
    uses: ./.github/workflows/brlapi315Build.yml

  dependencyResolution:
    name: Resolve NVDA dependencies on CPython 3.15
    needs: brlapi315
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout NVDA
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Checkout only local Python package submodules
        shell: pwsh
        run: git submodule update --init --depth 1 miscDeps include/nvda-mathcat
      - name: Download source-derived BRLAPI CP315
        uses: actions/download-artifact@v5
        with:
          name: brlapi-cp315-win-amd64
          path: .artifacts/brlapi-cp315
      - name: Stage BRLAPI CP315 into miscDeps
        shell: pwsh
        run: ./ci/scripts/stageBrlapi315.ps1 -ArtifactRoot .artifacts/brlapi-cp315 -MiscDepsRoot miscDeps
      - name: Install Python 3.15 x64
        id: python64
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.0-rc.2"
          architecture: x64
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
      - name: Bind uv to the setup-python interpreter
        shell: pwsh
        run: |
          $pythonPath = '${{ steps.python64.outputs.python-path }}'
          if (-not (Test-Path $pythonPath)) {
            throw "setup-python interpreter not found: $pythonPath"
          }
          "UV_PYTHON=$pythonPath" >> $env:GITHUB_ENV
          "UV_PYTHON_DOWNLOADS=never" >> $env:GITHUB_ENV
          & $pythonPath -c "import sys; assert sys.version_info[:2] == (3, 15), sys.version; print('uv CP315 interpreter:', sys.executable)"
      - name: Resolve and install NVDA application dependencies
        shell: pwsh
        run: |
          uv python find --no-managed-python
          uv sync --no-dev --no-install-project --locked
          uv pip check

  sourceBuildSmoke:
    name: Prepare NVDA source on CPython 3.15
    needs: brlapi315
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout NVDA
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Download source-derived BRLAPI CP315
        uses: actions/download-artifact@v5
        with:
          name: brlapi-cp315-win-amd64
          path: .artifacts/brlapi-cp315
      - name: Stage BRLAPI CP315 into miscDeps
        shell: pwsh
        run: ./ci/scripts/stageBrlapi315.ps1 -ArtifactRoot .artifacts/brlapi-cp315 -MiscDepsRoot miscDeps
      - name: Install Python 3.15 x64
        id: python64
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.0-rc.2"
          architecture: x64
      - name: Install Python 3.15 x86
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.0-rc.2"
          architecture: x86
          update-environment: false
      - name: Verify staged BRLAPI CP315 import
        shell: pwsh
        run: |
          $target = (Resolve-Path 'miscDeps\python').Path
          $env:PATH = "$target;$env:PATH"
          $env:BRLAPI_DLL_DIR = $target
          python -c "import os, pathlib, sys; assert sys.version_info[:2] == (3, 15), sys.version; p = pathlib.Path(r'miscDeps/python').resolve(); dll_dir = os.add_dll_directory(os.environ['BRLAPI_DLL_DIR']); sys.path.insert(0, str(p)); import brlapi; assert pathlib.Path(brlapi.__file__).parent == p, brlapi.__file__; print('NVDA staged BRLAPI CP315 import OK:', brlapi.__file__)"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
      - name: Bind uv to the setup-python interpreter
        shell: pwsh
        run: |
          $pythonPath = '${{ steps.python64.outputs.python-path }}'
          if (-not (Test-Path $pythonPath)) {
            throw "setup-python interpreter not found: $pythonPath"
          }
          "UV_PYTHON=$pythonPath" >> $env:GITHUB_ENV
          "UV_PYTHON_DOWNLOADS=never" >> $env:GITHUB_ENV
          uv python find --no-managed-python $pythonPath
      - name: Prepare NVDA source
        shell: cmd
        run: scons source --all-cores

  nativeAbiAudit:
    name: Reject CPython 3.13/3.14 tagged native modules
    needs: brlapi315
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout NVDA
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Checkout Python native artifact submodules
        shell: pwsh
        run: git submodule update --init --depth 1 miscDeps include/nvda-mathcat
      - name: Download source-derived BRLAPI CP315
        uses: actions/download-artifact@v5
        with:
          name: brlapi-cp315-win-amd64
          path: .artifacts/brlapi-cp315
      - name: Stage BRLAPI CP315 into miscDeps
        shell: pwsh
        run: ./ci/scripts/stageBrlapi315.ps1 -ArtifactRoot .artifacts/brlapi-cp315 -MiscDepsRoot miscDeps
      - name: Audit bundled native Python modules
        shell: pwsh
        run: |
          $roots = @('.', 'miscDeps', 'include/nvda-mathcat')
          $pyds = foreach ($root in $roots) {
            Get-ChildItem -Path $root -Recurse -File -Filter *.pyd -ErrorAction SilentlyContinue
          }
          $pyds = $pyds | Sort-Object -Property FullName -Unique
          $pyds | ForEach-Object { Write-Host $_.FullName }
          $legacy = $pyds | Where-Object { $_.Name -match 'cp31[34]' }
          if ($legacy) {
            Write-Error "Python 3.15 migration blocker: CPython 3.13/3.14 tagged .pyd files remain:`n$($legacy.FullName -join "`n")"
            exit 1
          }
          Write-Host "No CPython 3.13/3.14 tagged .pyd files found."
