name: Python 3.15 compatibility gates

on:
  workflow_dispatch:
  push:
    branches:
      - 'try-evolution/2027.1-python315-platform'
  pull_request:
    branches:
      - 'try-evolution/2027.1-python315-platform'

permissions:
  contents: read

concurrency:
  group: python315-compatibility-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.15.0-rc.2"
  PIP_VERSION: "26.2.1"
  UV_VERSION: "0.12.5"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  interpreters:
    name: CPython 3.15 x64 and x86
    runs-on: windows-2025-vs2026
    steps:
      - name: Install Python 3.15 x64
        id: python64
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Install Python 3.15 x86
        id: python32
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x86
          update-environment: false
      - name: Verify both interpreters
        shell: pwsh
        run: |
          python -c "import platform, sys; assert sys.version_info[:2] == (3, 15), sys.version; assert platform.architecture()[0] == '64bit'; print(sys.version, platform.architecture())"
          & '${{ steps.python32.outputs.python-path }}' -c "import platform, sys; assert sys.version_info[:2] == (3, 15), sys.version; assert platform.architecture()[0] == '32bit'; print(sys.version, platform.architecture())"

  pipBootstrap:
    name: ensurepip and pip on CPython 3.15 x64 and x86
    runs-on: windows-2025-vs2026
    steps:
      - name: Install Python 3.15 x64
        id: python64
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Install Python 3.15 x86
        id: python32
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x86
          update-environment: false
      - name: Bootstrap pip with ensurepip on both interpreters
        shell: pwsh
        run: |
          $venv64 = Join-Path $env:RUNNER_TEMP 'ensurepip-cp315-x64'
          $venv32 = Join-Path $env:RUNNER_TEMP 'ensurepip-cp315-x86'
          $python32 = '${{ steps.python32.outputs.python-path }}'
          python -c "import ensurepip; assert ensurepip.version() == '$env:PIP_VERSION', ensurepip.version(); print('ensurepip bundled pip x64:', ensurepip.version())"
          & $python32 -c "import ensurepip; assert ensurepip.version() == '$env:PIP_VERSION', ensurepip.version(); print('ensurepip bundled pip x86:', ensurepip.version())"
          python -m venv --without-pip $venv64
          & $python32 -m venv --without-pip $venv32
          $venvPython64 = Join-Path $venv64 'Scripts\python.exe'
          $venvPython32 = Join-Path $venv32 'Scripts\python.exe'
          & $venvPython64 -m ensurepip --upgrade
          & $venvPython32 -m ensurepip --upgrade
          & $venvPython64 -c "import pip; assert pip.__version__ == '$env:PIP_VERSION', pip.__version__; print('bootstrapped pip x64:', pip.__version__)"
          & $venvPython64 -m pip check
          & $venvPython32 -c "import pip; assert pip.__version__ == '$env:PIP_VERSION', pip.__version__; print('bootstrapped pip x86:', pip.__version__)"
          & $venvPython32 -m pip check
      - name: Verify runner pip on both interpreters
        shell: pwsh
        run: |
          python -m pip --version
          python -m pip check
          python -c "import pip, platform, sys; assert sys.version_info[:2] == (3, 15), sys.version; assert platform.architecture()[0] == '64bit'; assert pip.__version__ == '$env:PIP_VERSION', pip.__version__; print('pip CP315 x64 OK:', pip.__version__)"
          & '${{ steps.python32.outputs.python-path }}' -m pip --version
          & '${{ steps.python32.outputs.python-path }}' -m pip check
          & '${{ steps.python32.outputs.python-path }}' -c "import pip, platform, sys; assert sys.version_info[:2] == (3, 15), sys.version; assert platform.architecture()[0] == '32bit'; assert pip.__version__ == '$env:PIP_VERSION', pip.__version__; print('pip CP315 x86 OK:', pip.__version__)"

  mathcat:
    name: MathCAT abi3 import on CPython 3.15
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout NVDA
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Checkout only MathCAT
        shell: pwsh
        run: git submodule update --init --depth 1 include/nvda-mathcat
      - name: Install Python 3.15 x64
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Import MathCAT native extension
        shell: pwsh
        run: |
          python -c "import pathlib, sys; assert sys.version_info[:2] == (3, 15), sys.version; sys.path.insert(0, str(pathlib.Path('include/nvda-mathcat/assets').resolve())); import libmathcat_py; print('MathCAT Python 3.15 import OK:', libmathcat_py.__file__)"

  brlapi315:
    name: Build source-derived BRLAPI CP315
    uses: ./.github/workflows/brlapi315Build.yml

  wxpython315:
    name: Build wxPython CP315 wheel
    uses: ./.github/workflows/wxpython315Build.yml

  nativeRuntimeWheels315:
    name: Build remaining CP315 runtime wheels
    uses: ./.github/workflows/nativeRuntimeWheels315Build.yml

  dependencyResolution:
    name: Resolve NVDA dependencies on CPython 3.15
    needs: [brlapi315, wxpython315, nativeRuntimeWheels315]
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout NVDA
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Checkout only local Python package submodules
        shell: pwsh
        run: git submodule update --init --depth 1 miscDeps include/nvda-mathcat
      - name: Download source-derived BRLAPI CP315
        uses: actions/download-artifact@v5
        with:
          name: brlapi-cp315-win-amd64
          path: .artifacts/brlapi-cp315
      - name: Download project-built CP315 runtime wheels
        uses: actions/download-artifact@v5
        with:
          pattern: '*cp315-win-amd64'
          path: .artifacts/runtime-wheels
          merge-multiple: true
      - name: Stage BRLAPI CP315 into miscDeps
        shell: pwsh
        run: ./ci/scripts/stageBrlapi315.ps1 -ArtifactRoot .artifacts/brlapi-cp315 -MiscDepsRoot miscDeps
      - name: Verify expected CP315 wheel artifacts
        shell: pwsh
        run: |
          $expected = @(
            'wxPython-4.2.4-cp315-cp315-win_amd64.whl',
            'fast_diff_match_patch-2.1.0-cp315-cp315-win_amd64.whl',
            'fuzzysearch-0.8.1-cp315-cp315-win_amd64.whl'
          )
          foreach ($name in $expected) {
            $path = Join-Path '.artifacts/runtime-wheels' $name
            if (-not (Test-Path $path)) { throw "Required CP315 wheel artifact missing: $name" }
            Write-Host "$name SHA256=$((Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant())"
          }
      - name: Install Python 3.15 x64
        id: python64
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: Bind uv to the setup-python interpreter
        shell: pwsh
        run: |
          $pythonPath = '${{ steps.python64.outputs.python-path }}'
          if (-not (Test-Path $pythonPath)) {
            throw "setup-python interpreter not found: $pythonPath"
          }
          "UV_PYTHON=$pythonPath" >> $env:GITHUB_ENV
          "UV_PYTHON_DOWNLOADS=never" >> $env:GITHUB_ENV
          & $pythonPath -c "import sys; assert sys.version_info[:2] == (3, 15), sys.version; print('uv CP315 interpreter:', sys.executable)"
      - name: Resolve locked dependencies except project-built native wheels
        shell: pwsh
        run: |
          uv --version
          uv python find --no-managed-python
          uv sync --no-default-groups --no-install-project --locked `
            --no-install-package wxpython `
            --no-install-package fast-diff-match-patch `
            --no-install-package fuzzysearch
      - name: Install project-built CP315 runtime wheels
        shell: pwsh
        run: |
          $wheelRoot = (Resolve-Path '.artifacts/runtime-wheels').Path
          $wheels = @(
            (Join-Path $wheelRoot 'wxPython-4.2.4-cp315-cp315-win_amd64.whl'),
            (Join-Path $wheelRoot 'fast_diff_match_patch-2.1.0-cp315-cp315-win_amd64.whl'),
            (Join-Path $wheelRoot 'fuzzysearch-0.8.1-cp315-cp315-win_amd64.whl')
          )
          uv pip install --no-deps @wheels
          uv pip check
          uv run --no-sync python -c "import pathlib, sys, wx, fast_diff_match_patch, fuzzysearch, fuzzysearch._common as fc, fuzzysearch._substitutions_only as fs; assert sys.version_info[:2] == (3, 15); assert wx.version().startswith('4.2.4'); assert pathlib.Path(fast_diff_match_patch.__file__).suffix.lower() == '.pyd'; assert pathlib.Path(fc.__file__).suffix.lower() == '.pyd'; assert pathlib.Path(fs.__file__).suffix.lower() == '.pyd'; print('project-built CP315 runtime wheels imported OK')"

  sourceBuildSmoke:
    name: Prepare NVDA source on CPython 3.15
    needs: [brlapi315, wxpython315, nativeRuntimeWheels315]
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout NVDA
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Download source-derived BRLAPI CP315
        uses: actions/download-artifact@v5
        with:
          name: brlapi-cp315-win-amd64
          path: .artifacts/brlapi-cp315
      - name: Download project-built CP315 runtime wheels
        uses: actions/download-artifact@v5
        with:
          pattern: '*cp315-win-amd64'
          path: .artifacts/runtime-wheels
          merge-multiple: true
      - name: Stage BRLAPI CP315 into miscDeps
        shell: pwsh
        run: ./ci/scripts/stageBrlapi315.ps1 -ArtifactRoot .artifacts/brlapi-cp315 -MiscDepsRoot miscDeps
      - name: Install Python 3.15 x64
        id: python64
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Install Python 3.15 x86
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x86
          update-environment: false
      - name: Verify staged BRLAPI CP315 import
        shell: pwsh
        run: |
          $target = (Resolve-Path 'miscDeps\python').Path
          $env:PATH = "$target;$env:PATH"
          $env:BRLAPI_DLL_DIR = $target
          python -c "import os, pathlib, sys; assert sys.version_info[:2] == (3, 15), sys.version; p = pathlib.Path(r'miscDeps/python').resolve(); dll_dir = os.add_dll_directory(os.environ['BRLAPI_DLL_DIR']); sys.path.insert(0, str(p)); import brlapi; assert pathlib.Path(brlapi.__file__).parent == p, brlapi.__file__; print('NVDA staged BRLAPI CP315 import OK:', brlapi.__file__)"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: Bind uv to the setup-python interpreter
        shell: pwsh
        run: |
          $pythonPath = '${{ steps.python64.outputs.python-path }}'
          if (-not (Test-Path $pythonPath)) {
            throw "setup-python interpreter not found: $pythonPath"
          }
          "UV_PYTHON=$pythonPath" >> $env:GITHUB_ENV
          "UV_PYTHON_DOWNLOADS=never" >> $env:GITHUB_ENV
          uv python find --no-managed-python $pythonPath
      - name: Resolve build environment with project-built CP315 wheels
        shell: pwsh
        run: |
          uv sync --no-default-groups --group dev --no-install-project --locked `
            --no-install-package wxpython `
            --no-install-package fast-diff-match-patch `
            --no-install-package fuzzysearch
          $wheelRoot = (Resolve-Path '.artifacts/runtime-wheels').Path
          $wheels = @(
            (Join-Path $wheelRoot 'wxPython-4.2.4-cp315-cp315-win_amd64.whl'),
            (Join-Path $wheelRoot 'fast_diff_match_patch-2.1.0-cp315-cp315-win_amd64.whl'),
            (Join-Path $wheelRoot 'fuzzysearch-0.8.1-cp315-cp315-win_amd64.whl')
          )
          foreach ($wheel in $wheels) {
            if (-not (Test-Path $wheel)) { throw "Required CP315 wheel artifact missing: $wheel" }
          }
          uv pip install --no-deps @wheels
          uv pip check
      - name: Prepare NVDA source without re-syncing the validated environment
        shell: cmd
        env:
          UV_NO_SYNC: "1"
        run: scons source --all-cores

  nativeAbiAudit:
    name: Reject CPython 3.13/3.14 tagged native modules
    needs: brlapi315
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout NVDA
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Checkout Python native artifact submodules
        shell: pwsh
        run: git submodule update --init --depth 1 miscDeps include/nvda-mathcat
      - name: Download source-derived BRLAPI CP315
        uses: actions/download-artifact@v5
        with:
          name: brlapi-cp315-win-amd64
          path: .artifacts/brlapi-cp315
      - name: Stage BRLAPI CP315 into miscDeps
        shell: pwsh
        run: ./ci/scripts/stageBrlapi315.ps1 -ArtifactRoot .artifacts/brlapi-cp315 -MiscDepsRoot miscDeps
      - name: Audit bundled native Python modules
        shell: pwsh
        run: |
          $roots = @('.', 'miscDeps', 'include/nvda-mathcat')
          $pyds = foreach ($root in $roots) {
            Get-ChildItem -Path $root -Recurse -File -Filter *.pyd -ErrorAction SilentlyContinue
          }
          $pyds = $pyds | Sort-Object -Property FullName -Unique
          $pyds | ForEach-Object { Write-Host $_.FullName }
          $legacy = $pyds | Where-Object { $_.Name -match 'cp31[34]' }
          if ($legacy) {
            Write-Error "Python 3.15 migration blocker: CPython 3.13/3.14 tagged .pyd files remain:`n$($legacy.FullName -join "`n")"
            exit 1
          }
          Write-Host "No CPython 3.13/3.14 tagged .pyd files found."
