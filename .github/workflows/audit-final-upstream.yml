name: Audit final 2027.1 against NV Access master

on:
  push:
    branches:
      - audit/2027.1-final-vs-upstream

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch official NV Access master
        shell: bash
        run: |
          set -euo pipefail
          git remote add nvaccess https://github.com/nvaccess/nvda.git || true
          git fetch --depth=1 nvaccess master

      - name: Compare Git trees exactly
        env:
          FINAL_SHA: 3dae35c5b40d0eff4ea8dc3204d3469ed9416c08
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audits
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          final_ref = os.environ["FINAL_SHA"]
          upstream_ref = "refs/remotes/nvaccess/master"

          def entries(ref: str):
              raw = subprocess.check_output(["git", "ls-tree", "-r", "-z", "--full-tree", ref])
              result = {}
              for item in raw.split(b"\0"):
                  if not item:
                      continue
                  meta, path = item.split(b"\t", 1)
                  mode, kind, sha = meta.decode("utf-8").split()
                  result[path.decode("utf-8")] = (mode, kind, sha)
              return result

          final = entries(final_ref)
          upstream = entries(upstream_ref)
          paths = sorted(set(final) | set(upstream))
          rows = []
          counts = {"identical": 0, "modified": 0, "only_final": 0, "only_upstream": 0}
          for path in paths:
              f = final.get(path)
              u = upstream.get(path)
              if f is None:
                  status = "only_upstream"
              elif u is None:
                  status = "only_final"
              elif f == u:
                  status = "identical"
              else:
                  status = "modified"
              counts[status] += 1
              rows.append((status, path, f, u))

          upstream_sha = subprocess.check_output(["git", "rev-parse", upstream_ref], text=True).strip()
          final_tree = subprocess.check_output(["git", "rev-parse", f"{final_ref}^{{tree}}"], text=True).strip()
          upstream_tree = subprocess.check_output(["git", "rev-parse", f"{upstream_ref}^{{tree}}"], text=True).strip()

          tsv = Path("audits/FINAL-2027.1-UPSTREAM-COMPARISON.tsv")
          with tsv.open("w", encoding="utf-8", newline="\n") as f:
              f.write("status\tpath\tfinal_mode\tfinal_type\tfinal_sha\tupstream_mode\tupstream_type\tupstream_sha\n")
              for status, path, fv, uv in rows:
                  fm, ft, fs = fv if fv else ("", "", "")
                  um, ut, us = uv if uv else ("", "", "")
                  f.write(f"{status}\t{path}\t{fm}\t{ft}\t{fs}\t{um}\t{ut}\t{us}\n")

          only_upstream = [p for s, p, _, _ in rows if s == "only_upstream"]
          only_final = [p for s, p, _, _ in rows if s == "only_final"]
          modified = [p for s, p, _, _ in rows if s == "modified"]

          md = Path("audits/FINAL-2027.1-UPSTREAM-COMPARISON.md")
          with md.open("w", encoding="utf-8", newline="\n") as f:
              f.write("# Final 2027.1 vs NV Access master\n\n")
              f.write(f"- Final commit: `{final_ref}`\n")
              f.write(f"- Final tree: `{final_tree}`\n")
              f.write(f"- Official NV Access master: `{upstream_sha}`\n")
              f.write(f"- Official tree: `{upstream_tree}`\n\n")
              f.write("| Category | Count |\n|---|---:|\n")
              f.write(f"| Identical paths | {counts['identical']} |\n")
              f.write(f"| Modified paths | {counts['modified']} |\n")
              f.write(f"| Only final Evolution | {counts['only_final']} |\n")
              f.write(f"| Only official upstream | {counts['only_upstream']} |\n")
              f.write(f"| Paths in final | {len(final)} |\n")
              f.write(f"| Paths in upstream | {len(upstream)} |\n\n")
              f.write("## Only official upstream\n\n")
              if only_upstream:
                  for p in only_upstream:
                      f.write(f"- `{p}`\n")
              else:
                  f.write("None. Every official upstream path is present in the final Evolution tree.\n")
              f.write("\n## Only final Evolution\n\n")
              if only_final:
                  for p in only_final:
                      f.write(f"- `{p}`\n")
              else:
                  f.write("None.\n")
              f.write("\n## Modified paths\n\n")
              if modified:
                  for p in modified:
                      f.write(f"- `{p}`\n")
              else:
                  f.write("None.\n")
          PY

      - name: Save audit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/FINAL-2027.1-UPSTREAM-COMPARISON.md audits/FINAL-2027.1-UPSTREAM-COMPARISON.tsv
          git rm .github/workflows/audit-final-upstream.yml
          git commit -m "audit: record final 2027.1 comparison against NV Access master"
          git push
