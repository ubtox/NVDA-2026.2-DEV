name: Apply typed-character resilience

on:
  workflow_dispatch:
  push:
    branches:
      - 'try-evolution/2027.1-python315-platform'
    paths:
      - '.github/workflows/applySpeechResilience.yml'

permissions:
  contents: write

concurrency:
  group: apply-speech-resilience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Fetch reviewed upstream experiment
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 https://github.com/Khalil220/nvda.git pr/lazy-typing-protected-state
          git show FETCH_HEAD:source/speech/speech.py | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP\donor-speech.py"
          git show FETCH_HEAD:tests/unit/test_speechTypedCharacters.py | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP\donor-test.py"

      - name: Port only speakTypedCharacters and its tests
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import os

          current_path = Path("source/speech/speech.py")
          donor_path = Path(os.environ["RUNNER_TEMP"]) / "donor-speech.py"
          current = current_path.read_text(encoding="utf-8-sig")
          donor = donor_path.read_text(encoding="utf-8-sig")

          start_marker = "def speakTypedCharacters("
          end_marker = "\n\nclass SpeakTextInfoState"

          def extract(text: str) -> str:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[start:end]

          old_block = extract(current)
          new_block = extract(donor)
          if "cachedTypingIsProtected" in old_block:
              raise SystemExit("Typed-character resilience is already present; refusing duplicate patch")
          if "cachedTypingIsProtected" not in new_block:
              raise SystemExit("Expected lazy protected-state implementation missing from donor")
          if "api.isTypingProtected()" not in old_block:
              raise SystemExit("Current eager protected-state call shape changed; manual review required")

          current = current.replace(old_block, new_block, 1)
          current_path.write_text(current, encoding="utf-8", newline="\n")

          test_target = Path("tests/unit/test_speechTypedCharacters.py")
          if test_target.exists():
              raise SystemExit(f"{test_target} already exists; manual merge required")
          donor_test = (Path(os.environ["RUNNER_TEMP"]) / "donor-test.py").read_text(encoding="utf-8-sig")
          test_target.write_text(donor_test, encoding="utf-8", newline="\n")
          '@ | python -

      - name: Static safety checks
        shell: pwsh
        run: |
          python -m compileall -q source/speech/speech.py tests/unit/test_speechTypedCharacters.py
          python -c "from pathlib import Path; p=Path('source/speech/speech.py').read_text(encoding='utf-8'); assert p.count('cachedTypingIsProtected') >= 4; assert 'loggedWord = PROTECTED_CHAR * len(typedWord) if typingIsProtected() else typedWord' in p"
          git diff --check
          git diff -- source/speech/speech.py tests/unit/test_speechTypedCharacters.py

      - name: Commit focused resilience patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/speech/speech.py tests/unit/test_speechTypedCharacters.py
          if (git diff --cached --quiet) { throw "No resilience changes staged" }
          git commit -m "perf: avoid unnecessary protected-state calls while typing"
          git push origin HEAD:${{ github.ref_name }}
