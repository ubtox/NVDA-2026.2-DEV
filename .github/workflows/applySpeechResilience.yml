name: Apply bundled liblouis hardening

on:
  workflow_dispatch:
  push:
    branches:
      - 'try-evolution/2027.1-python315-platform'
    paths:
      - '.github/workflows/applySpeechResilience.yml'

permissions:
  contents: write

concurrency:
  group: apply-liblouis-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Pin liblouis loading to NVDA's bundled DLL
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          source_path = Path("source/louisHelper.py")
          source = source_path.read_text(encoding="utf-8-sig")
          if "_bundledLiblouisPath" in source:
              raise SystemExit("Bundled liblouis hardening already present")

          import_anchor = "from ctypes import (\n\tWINFUNCTYPE,"
          if source.count(import_anchor) != 1:
              raise SystemExit("Unexpected ctypes import layout in louisHelper.py")
          source = source.replace(
              import_anchor,
              "from ctypes import (\n\tCDLL,\n\tWINFUNCTYPE,",
              1,
          )

          old_loader = "with os.add_dll_directory(globalVars.appDir):\n\timport louis\n"
          new_loader = '''# Load the bundled liblouis by absolute path before importing the Python binding.
          # Windows process mitigation PreferSystem32Images can otherwise cause a stale System32
          # liblouis.dll to win over NVDA's application directory. Keeping this handle alive also
          # ensures the binding's subsequent basename load reuses this exact module.
          _BUNDLED_LIBLOUIS_DLL = "liblouis.dll"
          _bundledLiblouisPath = os.path.abspath(os.path.join(globalVars.appDir, _BUNDLED_LIBLOUIS_DLL))
          with os.add_dll_directory(globalVars.appDir):
          \t_bundledLiblouis = CDLL(_bundledLiblouisPath)
          \tif not hasattr(_bundledLiblouis, "lou_freeTableFile"):
          \t\traise RuntimeError(
          \t\t\tf"Bundled liblouis at {_bundledLiblouisPath!r} lacks required export lou_freeTableFile",
          \t\t)
          \timport louis
          '''
          if source.count(old_loader) != 1:
              raise SystemExit("Unexpected liblouis import layout in louisHelper.py")
          source_path.write_text(source.replace(old_loader, new_loader, 1), encoding="utf-8", newline="\n")

          test_path = Path("tests/unit/test_louisHelper.py")
          tests = test_path.read_text(encoding="utf-8-sig")
          if "TestBundledLiblouisLoading" in tests:
              raise SystemExit("Bundled liblouis tests already present")
          if "import globalVars\n" not in tests:
              tests = tests.replace("import brailleTables\n", "import brailleTables\nimport globalVars\n", 1)
          tests += '''

          class TestBundledLiblouisLoading(unittest.TestCase):
          \t"""Ensures Windows cannot redirect NVDA to a different liblouis DLL."""

          \tdef test_bindingUsesBundledAbsoluteDll(self):
          \t\texpectedPath = os.path.abspath(os.path.join(globalVars.appDir, "liblouis.dll"))
          \t\tself.assertTrue(os.path.isabs(louisHelper._bundledLiblouisPath))
          \t\tself.assertEqual(
          \t\t\tos.path.normcase(os.path.normpath(louisHelper._bundledLiblouisPath)),
          \t\t\tos.path.normcase(os.path.normpath(expectedPath)),
          \t\t)
          \t\tself.assertTrue(hasattr(louisHelper._bundledLiblouis, "lou_freeTableFile"))
          \t\tself.assertEqual(
          \t\t\tlouisHelper._bundledLiblouis._handle,
          \t\t\tlouisHelper.louis.liblouis._handle,
          \t\t\t"The Python binding must reuse NVDA's preloaded bundled liblouis module",
          \t\t)
          '''
          test_path.write_text(tests, encoding="utf-8", newline="\n")
          '@ | python -

      - name: Static safety checks
        shell: pwsh
        run: |
          python -m compileall -q source/louisHelper.py tests/unit/test_louisHelper.py
          python -c "from pathlib import Path; p=Path('source/louisHelper.py').read_text(encoding='utf-8'); assert 'CDLL(_bundledLiblouisPath)' in p; assert 'lou_freeTableFile' in p"
          git diff --check
          git diff -- source/louisHelper.py tests/unit/test_louisHelper.py

      - name: Commit focused DLL hardening
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/louisHelper.py tests/unit/test_louisHelper.py
          if (git diff --cached --quiet) { throw "No liblouis hardening changes staged" }
          git commit -m "security: pin liblouis loading to bundled DLL"
          git push origin HEAD:${{ github.ref_name }}
