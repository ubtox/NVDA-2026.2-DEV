name: Apply Python 3.15 CI migration

on:
  workflow_dispatch:
  push:
    branches:
      - 'try-evolution/2027.1-python315-platform'
    paths:
      - '.github/workflows/python315MigrationApply.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v7
        with:
          ref: try-evolution/2027.1-python315-platform
          fetch-depth: 0

      - name: Replace only the verified Python 3.14 CI pins
        shell: pwsh
        run: |
          $path = '.github/workflows/testAndPublish.yml'
          $text = Get-Content $path -Raw
          $expectedDefault = "defaultPythonVersion: '3.14.7'"
          $expectedSupported = "supportedPythonVersions: '[`"3.14.7`"]'"
          if (($text.Split($expectedDefault).Count - 1) -ne 1) {
            throw "Expected exactly one default Python 3.14.7 pin in $path"
          }
          if (($text.Split($expectedSupported).Count - 1) -ne 1) {
            throw "Expected exactly one supported Python 3.14.7 pin in $path"
          }
          $text = $text.Replace($expectedDefault, "defaultPythonVersion: '3.15.0-rc.2'")
          $text = $text.Replace($expectedSupported, "supportedPythonVersions: '[`"3.15.0-rc.2`"]'")
          Set-Content -Path $path -Value $text -Encoding utf8NoBOM
          if (Select-String -Path $path -Pattern "3\.14\.7" -Quiet) {
            throw 'Python 3.14.7 remains in the primary workflow after migration.'
          }

      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- .github/workflows/testAndPublish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/testAndPublish.yml
          git commit -m 'ci: run primary pipeline on Python 3.15 rc2'
          git push origin HEAD:try-evolution/2027.1-python315-platform
