name: Apply Python 3.15 source dependency integration

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/python315-pinned-source-provenance'
    paths:
      - '.github/workflows/python315MigrationApply.yml'

permissions:
  contents: write

concurrency:
  group: python315-source-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    name: Pin, lock and install py2exe from source on CPython 3.15
    runs-on: windows-2025-vs2026
    env:
      PY2EXE_REF: '1be98bd71ac737f73aa146631ab902b2b1cc43f7'
      CONFIGOBJ_REF: '9c8a0a80c767bf8a3d6493ed01df6c351bddca42'

    steps:
      - name: Checkout active integration branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Guard migration branch
        shell: pwsh
        run: |
          $allowed = @(
            'fix/python315-pinned-source-provenance',
            'try-evolution/2027.1-python315-platform'
          )
          if ('${{ github.ref_name }}' -notin $allowed) {
            throw 'This migration workflow may only update the Python 3.15 integration branches.'
          }

      - name: Checkout only local package submodules required by uv
        shell: pwsh
        run: git submodule update --init --depth 1 miscDeps include/nvda-mathcat

      - name: Install CPython 3.15 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.15.0-rc.2'
          architecture: x64

      - name: Install CPython 3.15 x86
        id: python32
        uses: actions/setup-python@v6
        with:
          python-version: '3.15.0-rc.2'
          architecture: x86
          update-environment: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.5'
          python-version: cpython-3.15.0rc2-windows-x86_64-none

      - name: Pin validated py2exe source revision in project configuration
        shell: python
        run: |
          from pathlib import Path

          path = Path('pyproject.toml')
          text = path.read_text(encoding='utf-8')
          source_line = 'py2exe = { git = "https://github.com/py2exe/py2exe", rev = "${{ env.PY2EXE_REF }}" }\n'

          if source_line not in text:
              if 'py2exe = { git =' in text:
                  raise SystemExit('An unexpected py2exe Git source already exists; review it instead of overwriting it.')
              marker = '[tool.uv.sources]\n'
              if text.count(marker) != 1:
                  raise SystemExit('Expected exactly one [tool.uv.sources] table.')
              text = text.replace(marker, marker + source_line, 1)
              path.write_text(text, encoding='utf-8', newline='\n')

          required_fragments = (
              'no-binary-package = ["py2exe"]',
              'name = "py2exe"',
              'version = "0.14.2.0"',
              'requires-python = ">=3.10,<3.16"',
              'requires-dist = ["cachetools", "packaging", "pefile"]',
              source_line.strip(),
          )
          current = path.read_text(encoding='utf-8')
          missing = [fragment for fragment in required_fragments if fragment not in current]
          if missing:
              raise SystemExit(f'Missing required py2exe CP315 configuration: {missing}')

      - name: Pin validated source dependencies in synthDriverHost32 configuration
        shell: python
        run: |
          from pathlib import Path

          path = Path('runtime-builders/synthDriverHost32/pyproject.toml')
          text = path.read_text(encoding='utf-8')

          old_py2exe = '"py2exe==0.14.1.1",'
          new_py2exe = '"py2exe==0.14.2.0",'
          if old_py2exe in text:
              if text.count(old_py2exe) != 1:
                  raise SystemExit('Unexpected duplicate synthDriverHost32 py2exe requirement.')
              text = text.replace(old_py2exe, new_py2exe, 1)
          elif new_py2exe not in text:
              raise SystemExit('Unexpected synthDriverHost32 py2exe requirement; review before changing it.')

          old_comment = '# Packaging NVDA. py2exe currently blocks Python 3.15 and must be ported before this builder can package successfully.'
          new_comment = '# Package the 32-bit synth driver host from the same validated py2exe source revision as NVDA.'
          if old_comment in text:
              text = text.replace(old_comment, new_comment, 1)

          if 'required-version = ">=0.7.9"' in text:
              text = text.replace('required-version = ">=0.7.9"', 'required-version = ">=0.9"', 1)
          elif 'required-version = ">=0.9"' not in text:
              raise SystemExit('Unexpected synthDriverHost32 uv version requirement.')

          if 'no-binary-package = ["py2exe"]' not in text:
              marker = 'required-version = ">=0.9"\n'
              if text.count(marker) != 1:
                  raise SystemExit('Expected one synthDriverHost32 uv required-version setting.')
              text = text.replace(marker, marker + 'no-binary-package = ["py2exe"]\n', 1)

          metadata = '''\n[[tool.uv.dependency-metadata]]\nname = "py2exe"\nversion = "0.14.2.0"\nrequires-python = ">=3.10,<3.16"\nrequires-dist = ["cachetools", "packaging", "pefile"]\n\n[tool.uv.sources]\npy2exe = { git = "https://github.com/py2exe/py2exe", rev = "${{ env.PY2EXE_REF }}" }\nconfigobj = { git = "https://github.com/DiffSK/configobj", rev = "${{ env.CONFIGOBJ_REF }}" }\n'''
          if '[tool.uv.sources]' not in text:
              marker = '\n[dependency-groups]\n'
              if text.count(marker) != 1:
                  raise SystemExit('Expected one synthDriverHost32 dependency-groups table.')
              text = text.replace(marker, metadata + marker, 1)

          required_fragments = (
              'requires-python = ">=3.15.0rc2,<3.16"',
              'no-binary-package = ["py2exe"]',
              '"py2exe==0.14.2.0"',
              'name = "py2exe"',
              'version = "0.14.2.0"',
              'requires-python = ">=3.10,<3.16"',
              'py2exe = { git = "https://github.com/py2exe/py2exe", rev = "${{ env.PY2EXE_REF }}" }',
              'configobj = { git = "https://github.com/DiffSK/configobj", rev = "${{ env.CONFIGOBJ_REF }}" }',
          )
          missing = [fragment for fragment in required_fragments if fragment not in text]
          if missing:
              raise SystemExit(f'Missing synthDriverHost32 CP315 configuration: {missing}')

          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Remove invalid setup-uv prerelease interpreter overrides from CI
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/testAndPublish.yml')
          text = path.read_text(encoding='utf-8')
          token = 'cpython-' + '$' + '{{ matrix.pythonVersion }}-windows-' + '$' + '{{ env.uv-arch }}-none'
          block = '      with:\n        python-version: ' + token + '\n'
          count = text.count(block)
          if count not in (0, 4):
              raise SystemExit(f'Expected 4 legacy setup-uv interpreter override blocks or none, found {count}.')
          if count == 4:
              text = text.replace(block, '')
              path.write_text(text, encoding='utf-8', newline='\n')
          if token in path.read_text(encoding='utf-8'):
              raise SystemExit('Legacy setup-uv prerelease interpreter override remains after migration.')

      - name: Regenerate root lock for CPython 3.15
        shell: pwsh
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3, 15), sys.version; print(sys.version)"
          uv lock --refresh-package py2exe

      - name: Regenerate synthDriverHost32 lock with CPython 3.15 x86
        shell: pwsh
        env:
          UV_PYTHON: ${{ steps.python32.outputs.python-path }}
        run: |
          & '${{ steps.python32.outputs.python-path }}' -c "import platform, sys; assert sys.version_info[:2] == (3, 15), sys.version; assert platform.architecture()[0] == '32bit'; print(sys.version, platform.architecture())"
          uv lock --directory runtime-builders/synthDriverHost32 --refresh-package py2exe

      - name: Verify root lock provenance
        shell: python
        run: |
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path('uv.lock').read_text(encoding='utf-8'))
          requires_python = data.get('requires-python', '')
          if requires_python != '==3.15.*':
              raise SystemExit(f'Unexpected lock Python range: {requires_python!r}')

          matches = [pkg for pkg in data.get('package', []) if pkg.get('name') == 'py2exe']
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one locked py2exe package, found {len(matches)}')
          source = matches[0].get('source', {})
          git_source = source.get('git', '')
          expected = '${{ env.PY2EXE_REF }}'
          if expected not in git_source:
              raise SystemExit(f'py2exe lock source is not pinned to {expected}: {source!r}')
          print('Locked root py2exe source:', git_source)

      - name: Verify synthDriverHost32 lock provenance
        shell: python
        run: |
          from pathlib import Path
          import tomllib

          lock_path = Path('runtime-builders/synthDriverHost32/uv.lock')
          data = tomllib.loads(lock_path.read_text(encoding='utf-8'))
          requires_python = data.get('requires-python', '')
          if '3.15' not in requires_python or '3.14' in requires_python:
              raise SystemExit(f'Unexpected synthDriverHost32 lock Python range: {requires_python!r}')

          matches = [pkg for pkg in data.get('package', []) if pkg.get('name') == 'py2exe']
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one synthDriverHost32 py2exe package, found {len(matches)}')
          source = matches[0].get('source', {})
          git_source = source.get('git', '')
          expected = '${{ env.PY2EXE_REF }}'
          if expected not in git_source:
              raise SystemExit(f'synthDriverHost32 py2exe lock source is not pinned to {expected}: {source!r}')
          print('Locked synthDriverHost32 py2exe source:', git_source)

      - name: Build and install the root dev-group py2exe source through uv
        shell: pwsh
        run: |
          uv sync --locked --only-group dev --no-install-package nvda-misc-deps --no-install-package nvda-mathcat
          uv run --locked --no-sync python -c "import sys, py2exe, py2exe.runtime; assert sys.version_info[:2] == (3, 15), sys.version; print('NVDA uv py2exe CP315 source integration OK:', py2exe.__file__)"

      - name: Build and install synthDriverHost32 dependencies with CPython 3.15 x86
        shell: pwsh
        env:
          UV_PYTHON: ${{ steps.python32.outputs.python-path }}
        run: |
          uv sync --locked --directory runtime-builders/synthDriverHost32
          uv run --locked --directory runtime-builders/synthDriverHost32 python -c "import platform, sys, py2exe, py2exe.runtime; assert sys.version_info[:2] == (3, 15), sys.version; assert platform.architecture()[0] == '32bit'; print('synthDriverHost32 py2exe CP315 x86 integration OK:', py2exe.__file__)"

      - name: Validate and commit generated project state
        shell: pwsh
        run: |
          git diff --check
          git diff -- .github/workflows/testAndPublish.yml pyproject.toml uv.lock runtime-builders/synthDriverHost32/pyproject.toml runtime-builders/synthDriverHost32/uv.lock
          if (-not (git status --porcelain)) {
            Write-Host 'Project source, locks and CI routing are already current.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/testAndPublish.yml pyproject.toml uv.lock runtime-builders/synthDriverHost32/pyproject.toml runtime-builders/synthDriverHost32/uv.lock
          git diff --cached --check
          git commit -m 'build: align Python 3.15 dependency and CI routing'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
