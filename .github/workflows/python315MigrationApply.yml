name: Apply Python 3.15 dependency migration

on:
  workflow_dispatch:
  push:
    branches:
      - 'try-evolution/2027.1-python315-platform'
    paths:
      - '.github/workflows/python315MigrationApply.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v7
        with:
          ref: try-evolution/2027.1-python315-platform
          fetch-depth: 0

      - name: Move validated py2exe CP315 override into pyproject
        shell: python
        run: |
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          old = '''[tool.uv]
          default-groups = "all"
          python-preference = "only-system"
          environments = ["sys_platform == 'win32'"]
          required-version = ">=0.9"

          [tool.setuptools]
          '''
          new = '''[tool.uv]
          default-groups = "all"
          python-preference = "only-system"
          environments = ["sys_platform == 'win32'"]
          required-version = ">=0.9"
          no-binary-package = ["py2exe"]

          [[tool.uv.dependency-metadata]]
          name = "py2exe"
          version = "0.14.2.0"
          requires-python = ">=3.10,<3.16"
          requires-dist = ["cachetools", "packaging", "pefile"]

          [tool.setuptools]
          '''
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one unmodified [tool.uv] block")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

      - name: Remove invalid standalone uv configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f uv.toml
          git rm uv.toml

      - name: Validate and commit dependency migration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'no-binary-package = ["py2exe"]' pyproject.toml
          grep -F 'requires-python = ">=3.10,<3.16"' pyproject.toml
          test ! -e uv.toml
          git diff -- pyproject.toml uv.toml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml uv.toml
          git commit -m 'build: resolve validated py2exe source on Python 3.15'
          git push origin HEAD:try-evolution/2027.1-python315-platform
