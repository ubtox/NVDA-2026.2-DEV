name: Reconcile archive port with upstream

on:
  push:
    branches:
      - 'consolidation/all-nvda-useful'
    paths:
      - '.github/workflows/reconcile-archive-upstream.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@v7
        with:
          ref: consolidation/all-nvda-useful
          fetch-depth: 0

      - name: Set up Python 3.14.7
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'

      - name: Preserve upstream focus correctness
        shell: pwsh
        run: |
          python .github/reconcile_archive_upstream.py
          python -m py_compile source/NVDAObjects/UIA/__init__.py tests/unit/test_speechTypedCharacters_secure.py

      - name: Commit reconciled archive port
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git rm .github/reconcile_archive_upstream.py
          git rm .github/workflows/reconcile-archive-upstream.yml
          git add source/NVDAObjects/UIA/__init__.py tests/unit/test_speechTypedCharacters_secure.py
          git diff --cached --check
          git commit -m "Preserve upstream UIA focus fix in V8 consolidation"
          git push origin HEAD:consolidation/all-nvda-useful
