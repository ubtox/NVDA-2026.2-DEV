name: Durable Evolution validation

on:
  push:
    branches:
      - 'evolution/**'
      - 'final/**'

permissions:
  actions: write
  contents: read

concurrency:
  group: durable-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch CI, Real Apps and upstream audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch validation workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run testAndPublish.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          gh workflow run realAppCompatibility.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          gh workflow run upstreamAudit.yml --repo "$GITHUB_REPOSITORY" --ref nvda-2026.2-dev \
            -f target_ref="$GITHUB_REF_NAME" \
            -f upstream_ref=master \
            -f fail_on_unexpected=false
