name: Probe py2exe on Python 3.15

on:
  workflow_dispatch:
  push:
    branches:
      - 'try-evolution/2027.1-python315-platform'
      - 'fix/python315-pinned-source-provenance'
    paths:
      - '.github/workflows/py2exe315Probe.yml'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.15.0-rc.2'
  # Immutable upstream source revision. Do not move this without re-running both
  # architecture probes and reviewing the upstream delta.
  PY2EXE_REF: '1be98bd71ac737f73aa146631ab902b2b1cc43f7'

jobs:
  probe:
    name: py2exe source build CP315 ${{ matrix.arch }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]

    steps:
      - name: Checkout pinned py2exe upstream source
        uses: actions/checkout@v7
        with:
          repository: py2exe/py2exe
          ref: ${{ env.PY2EXE_REF }}

      - name: Verify pinned py2exe source revision
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ env.PY2EXE_REF }}') {
            throw "Unexpected py2exe source revision: $actual"
          }
          git show -s --format=fuller HEAD

      - name: Install Python 3.15
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.arch }}

      - name: Install build tools
        shell: pwsh
        run: python -m pip install --upgrade pip setuptools wheel build

      - name: Apply reviewed CPython 3.15 source compatibility patch
        shell: pwsh
        run: |
          $path = 'setup.py'
          $text = Get-Content $path -Raw
          if ($text -notmatch "python_requires='>=3\.10, <3\.15'") {
            throw 'Expected pinned py2exe Python upper bound was not found; inspect upstream before changing the patch.'
          }
          $text = $text.Replace("python_requires='>=3.10, <3.15'", "python_requires='>=3.10, <3.16'")
          Set-Content -Path $path -Value $text -Encoding utf8
          git diff --check
          git diff -- setup.py

      - name: Build py2exe wheel from pinned source
        shell: pwsh
        run: python -m build --wheel

      - name: Install generated py2exe wheel
        shell: pwsh
        run: python -m pip install --find-links dist py2exe

      - name: Smoke-test installed py2exe wheel
        shell: pwsh
        run: |
          $probeDir = Join-Path $env:RUNNER_TEMP 'py2exe-cp315-probe'
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          Push-Location $probeDir
          try {
            python -c "import sys, py2exe; assert sys.version_info[:2] == (3, 15), sys.version; assert 'site-packages' in py2exe.__file__.lower(), py2exe.__file__; import py2exe.runtime; print('py2exe CP315 installed-wheel import OK:', py2exe.__file__)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Freeze and execute a CP315 native-extension probe
        shell: pwsh
        run: |
          $probeDir = Join-Path $env:RUNNER_TEMP 'py2exe-cp315-probe'
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null

          @'
          import _ssl
          import math
          import sqlite3
          import sys
          import zlib

          assert sys.version_info[:2] == (3, 15), sys.version
          print("PY2EXE_CP315_RUNTIME_OK")
          '@ | Set-Content -Path (Join-Path $probeDir 'cp315_probe.py') -Encoding utf8

          @'
          from py2exe import freeze

          freeze(
              console=[{"script": "cp315_probe.py"}],
              options={
                  "bundle_files": 3,
                  "dist_dir": "cp315_dist",
                  "excludes": ["tkinter"],
              },
          )
          '@ | Set-Content -Path (Join-Path $probeDir 'freeze_cp315_probe.py') -Encoding utf8

          Push-Location $probeDir
          try {
            python freeze_cp315_probe.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $output = & .\cp315_dist\cp315_probe.exe 2>&1
            $exitCode = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($exitCode -ne 0) { exit $exitCode }
            if (($output -join "`n") -notmatch 'PY2EXE_CP315_RUNTIME_OK') {
              throw 'Frozen CPython 3.15 executable did not produce the expected runtime marker.'
            }
          } finally {
            Pop-Location
          }

      - name: Upload CP315 wheel
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: py2exe-cp315-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error
