name: Autofix or fail

on:
  push:
    # Never auto-fix the protected branches; PRs to them use pull_request below.
    branches-ignore:
      - master
      - beta
      - rc
  pull_request:
    branches:
      - master
      - beta
      - rc
      - 'try-**'
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Auto-fix and lint gate
    # On the base repo the pull_request run is the gate; skip its push run on non-Fork pushes to
    # avoid a duplicate. Fork pushes still run for autofix.
    if: github.event_name != 'push' || github.repository != 'nvaccess/nvda'
    runs-on: windows-2025-vs2026
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Set up python
      uses: actions/setup-python@v6
      with:
        # Keep in sync with defaultPythonVersion in testAndPublish.yml.
        python-version: '3.15.0-rc.2'
    - name: Install the project uv version
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.12.5"
        activate-environment: "false"
    # Autofix role: run the fixer hooks (the "autofix" group) and push the fixes.
    - name: Apply prek auto-fixes
      if: github.event_name == 'push'
      shell: bash
      env:
        REF_NAME: ${{ github.ref_name }}
      run: |
        # Fixers exit non-zero when they change files. Some fixers' output feeds
        # another fixer, so a single pass may not reach a stable tree.
        # Re-run on the fixed tree until prek exits clean or we hit the cap.
        for attempt in 1 2 3; do
          if uvx prek run --group autofix --all-files; then
            break
          fi
        done

        # One-time CPython 3.15 migration cleanup on the isolated validation branch.
        # Only mechanical Ruff transformations are allowed here. Rules that can
        # change API/branching semantics (TRY004, SIM102, UP046) stay manual.
        if [[ "$REF_NAME" == "fix/python315-lint-and-uv-pin" ]]; then
          set +e
          uvx --from ruff==0.16.3 ruff check \
            --fix --unsafe-fixes \
            --select I001,F401,UP031,RUF028,UP028,SIM117,UP035 \
            ci/scripts/officialSourceInventory.py \
            nvdaHelper/UIARemote/sconscript \
            nvdaHelper/archBuild_sconscript \
            source/NVDAObjects/__init__.py \
            source/UIAHandler/_remoteOps/instructions/__init__.py \
            source/UIAHandler/_remoteOps/instructions/_base.py \
            source/UIAHandler/_remoteOps/instructions/controlFlow.py \
            source/UIAHandler/_remoteOps/instructions/element.py \
            source/UIAHandler/_remoteOps/instructions/guid.py \
            source/UIAHandler/_remoteOps/instructions/stringMap.py \
            source/UIAHandler/_remoteOps/instructions/textPattern.py \
            source/UIAHandler/_remoteOps/lowLevel.py \
            source/UIAHandler/_remoteOps/operation.py \
            source/UIAHandler/_remoteOps/remoteAPI.py \
            source/UIAHandler/_remoteOps/remoteTypes/__init__.py \
            source/UIAHandler/_remoteOps/remoteTypes/cacheRequest.py \
            source/UIAHandler/_remoteOps/remoteTypes/element.py \
            source/UIAHandler/_remoteOps/remoteTypes/textPattern.py \
            source/UIAHandler/_remoteOps/remoteTypes/textRange.py \
            source/UIAHandler/browseMode.py \
            source/speech/speech.py \
            tests/unit/test_UIARemoteOps/test_highLevel/test_array.py \
            tests/unit/test_UIARemoteOps/test_highLevel/test_if.py \
            tests/unit/test_UIARemoteOps/test_highLevel/test_stringMap.py \
            tests/unit/test_speechTypedCharacters.py
          set -e
          git diff --check
        fi

        if ! git diff --quiet; then
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Auto-fix: apply targeted CPython 3.15 lint fixes"
          # Push via an explicit refspec so this works even if checkout left us
          # in a detached HEAD state.
          git push origin HEAD:"$REF_NAME"
        fi
    # Gate role: the merge-required blocking check (non-zero exit fails the job).
    # The skipped hooks are the heavy/env-bound ones with dedicated jobs in
    # testAndPublish.yml.
    - name: Lint gate
      uses: j178/prek-action@v2
      with:
        extra-args: >-
          --all-files
          --skip checkPo
          --skip scons-source
          --skip checkPot
          --skip unitTest
          --skip licenseCheck
          --skip pyright
          --skip ty
