name: Real application compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - 'try-evolution/**'
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: real-app-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vscode:
    name: VS Code (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2022
          - windows-2025-vs2026

    steps:
      - name: Checkout NVDA
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Initialize nested dependencies
        shell: pwsh
        run: git submodule update --init --recursive

      - name: Install Python x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.0-rc.2"
          architecture: x64

      - name: Install Python x86 for synth driver host
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.0-rc.2"
          architecture: x86
          update-environment: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: cpython-3.15.0rc2-windows-x86_64-none

      - name: Install Visual Studio Code
        shell: pwsh
        run: choco install vscode --yes --no-progress

      - name: Set build variables
        shell: pwsh
        run: ci/scripts/setBuildVersionVars.ps1

      - name: Set SCons arguments
        shell: pwsh
        run: ci/scripts/setSconsArgs.ps1

      - name: Build NVDA source
        shell: cmd
        run: scons source %sconsArgs% %sconsCores%

      - name: Verify MathCAT native module on Python 3.15
        shell: pwsh
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE ".venv\Scripts\python.exe"
          & $python -c "import sys; assert sys.version_info[:2] == (3, 15), sys.version; sys.path.insert(0, r'source'); import libmathcat_py; print('MathCAT Python 3.15 import OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build launcher
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name SignPath -Force
          cmd /c "scons launcher client moduleList %sconsArgs% %sconsCores%"

      - name: Install NVDA for system tests
        shell: pwsh
        env:
          nvdaLauncherDir: ${{ github.workspace }}\output
        run: |
          New-Item -ItemType Directory -Force -Path testOutput\install | Out-Null
          ci/scripts/installNVDA.ps1

      - name: Run VS Code system tests
        shell: pwsh
        env:
          nvdaLauncherDir: ${{ github.workspace }}\output
          INCLUDE_SYSTEM_TEST_TAGS: vscode
        run: ci/scripts/tests/systemTests.ps1

      - name: Upload VS Code test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vscode-${{ matrix.runner }}
          if-no-files-found: warn
          path: |
            testOutput/system
            testOutput/install
            *.log
            nvda.log
