# Keep the isolated 32-bit runtime builder on the same deterministic uv toolchain as NVDA.
# Project dependency sources remain in [tool.uv.sources] in this runtime's pyproject.toml.
required-version = "==0.12.5"
default-groups = "all"
python-preference = "only-system"
environments = ["sys_platform == 'win32'"]
no-binary-package = ["py2exe"]

[[dependency-metadata]]
name = "py2exe"
version = "0.14.2.0"
requires-python = ">=3.10,<3.16"
requires-dist = ["cachetools", "packaging", "pefile"]
